name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk StudyFocusLock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFocusLock-apk
          path: StudyFocusLock.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Study Focus Lock v${{ github.run_number }}
          files: StudyFocusLock.apk
